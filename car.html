<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Details | Encar Auto</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #fafbfc;
            color: #1a202c;
            line-height: 1.5;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9rem;
        }

        .back-link:hover {
            color: #1a202c;
        }

        .car-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .image-gallery {
            width: 100%;
            height: 400px;
            background: #f7fafc;
            overflow: hidden;
            position: relative;
        }

        @media (max-width: 640px) {
            .image-gallery {
                height: 250px;
            }
        }

        .gallery-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .content {
            padding: 30px;
        }

        @media (max-width: 640px) {
            .content {
                padding: 20px;
            }
        }

        .title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        @media (max-width: 640px) {
            .title {
                font-size: 1.5rem;
            }
        }

        .price {
            font-size: 1.8rem;
            font-weight: 700;
            color: #1a202c;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 1px solid #edf2f7;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.75rem;
            color: #a0aec0;
            text-transform: uppercase;
            font-weight: 600;
        }

        .info-value {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .action-btn {
            display: block;
            width: 100%;
            background: #1a202c;
            color: white;
            text-align: center;
            padding: 18px;
            border-radius: 12px;
            font-weight: 700;
            text-decoration: none;
            transition: background 0.2s;
            margin-top: 20px;
        }

        .action-btn:hover {
            background: #2d3748;
        }

        .secondary-btn {
            display: block;
            width: 100%;
            text-align: center;
            padding: 15px;
            color: #718096;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #1a202c;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container" id="content">
        <div class="loading">
            <div class="spinner"></div>
        </div>
    </div>

    <script>
        const translations = {
            '디зел': 'Diesel', '디젤': 'Diesel', '가솔린': 'Gasoline', '휘발유': 'Gasoline', '가솔린+전기': 'Hybrid (Gasoline)',
            'LPG': 'LPG', '하이브리드': 'Hybrid', '전기': 'Electric', '검정색': 'Black', '흰색': 'White',
            '은색': 'Silver', '회색': 'Gray', '쥐색': 'Dark Gray', '파란색': 'Blue', '빨간색': 'Red',
            '노ран색': 'Yellow', '녹색': 'Green', '오то': 'Auto', '수동': 'Manual'
        };
        const translate = (text) => translations[text] || text || '-';

        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const carId = urlParams.get('id');
            const root = document.getElementById('content');

            if (!carId) {
                root.innerHTML = '<p>Missing ID</p>';
                return;
            }

            try {
                const res = await fetch(`/api/car/${carId}`);
                if (!res.ok) throw new Error('Car not found');
                const data = await res.json();
                renderCar(data, carId);
            } catch (e) {
                root.innerHTML = `<h3>Car not found</h3><a href="/catalog.html" class="back-link">Return to Catalog</a>`;
            }
        }

        function renderCar(data, id) {
            const cat = data.category || {};
            const spec = data.spec || {};
            const ad = data.advertisement || {};
            const photos = data.photos || [];

            const carName = `${cat.manufacturerEnglishName || cat.manufacturerName || ''} ${cat.modelGroupEnglishName || cat.modelGroupName || ''} ${cat.gradeEnglishName || cat.gradeName || ''}`.trim();
            const rawPhotoPath = photos[0]?.location || photos[0]?.path || '';
            const photoUrl = rawPhotoPath ? `/api/image?url=${encodeURIComponent('https://ci.encar.com' + rawPhotoPath)}` : '';

            document.getElementById('content').innerHTML = `
                <a href="/catalog.html" class="back-link">← Catalog</a>
                <div class="car-card">
                    <div class="image-gallery">
                        <img src="${photoUrl}" class="gallery-img">
                    </div>
                    <div class="content">
                        <h1 class="title">${carName}</h1>
                        <div class="price">₩ ${(ad.price * 10000).toLocaleString()}</div>
                        <div class="info-grid">
                            <div class="info-item"><span class="info-label">Year</span><span class="info-value">${spec.yearName || '-'}</span></div>
                            <div class="info-item"><span class="info-label">Mileage</span><span class="info-value">${(spec.mileage || 0).toLocaleString()} km</span></div>
                            <div class="info-item"><span class="info-label">Fuel</span><span class="info-value">${translate(spec.fuelName)}</span></div>
                            <div class="info-item"><span class="info-label">Color</span><span class="info-value">${translate(spec.colorName)}</span></div>
                            <div class="info-item"><span class="info-label">Mission</span><span class="info-value">${translate(spec.transmissionName)}</span></div>
                            <div class="info-item"><span class="info-label">Engine</span><span class="info-value">${spec.displacement || '-'} cc</span></div>
                        </div>
                        <a href="https://fem.encar.com/cars/detail/${id}" target="_blank" class="action-btn">View Original on Encar</a>
                        <a href="#" onclick="window.history.back()" class="secondary-btn">Go Back</a>
                    </div>
                </div>
            `;
        }

        init();
    </script>
</body>

</html>
