<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encar Live Catalog</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            padding: 40px 20px;
        }

        .header {
            max-width: 1400px;
            margin: 0 auto 40px;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            color: #718096;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #48bb78;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .catalog {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
        }

        .card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
        }

        .card.placeholder {
            position: relative;
            filter: grayscale(100%);
        }

        .card.placeholder::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .placeholder-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: #4a5568;
        }

        .placeholder-overlay h3 {
            font-size: 1.2rem;
            margin-bottom: 8px;
        }

        .placeholder-overlay p {
            font-size: 0.9rem;
            color: #718096;
        }

        .card-image {
            width: 100%;
            height: 200px;
            object-fit: cover;
            background: #e2e8f0;
        }

        .card-body {
            padding: 20px;
        }

        .car-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .specs-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .spec-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .spec-label {
            font-size: 0.75rem;
            color: #a0aec0;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .spec-value {
            font-size: 0.95rem;
            color: #2d3748;
            font-weight: 600;
        }

        .price-tag {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 200px;
            color: #a0aec0;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .error-card {
            background: #fff5f5;
            border: 2px dashed #fc8181;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 300px;
            color: #c53030;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>
    <div class="header">
        <h1>🚗 Live Car Catalog</h1>
        <div class="status">
            <div class="status-dot"></div>
            <span>Auto-refresh every <strong>30 seconds</strong></span>
        </div>
    </div>

    <div class="catalog" id="catalog">
        <!-- Cards will be inserted here -->
    </div>

    <script>
        // Car IDs to fetch (5 real cars + 1 placeholder for upcoming)
        const ACTIVE_CAR_IDS = [40570144, 40569845, 40569123, 40568901, 40568700];
        const UPCOMING_CAR_SLOT_ID = 40550000; // ID that likely doesn't exist yet
        const REFRESH_INTERVAL = 30000; // 30 seconds

        const translations = {
            '디젤': 'Diesel',
            '가솔린': 'Gasoline',
            '휘발유': 'Gasoline',
            'LPG': 'LPG',
            '하이브리드': 'Hybrid',
            '전기': 'Electric',
            '검정색': 'Black',
            '흰색': 'White',
            '은색': 'Silver',
            '회색': 'Gray',
            '파란색': 'Blue',
            '빨간색': 'Red'
        };

        function translate(text) {
            return translations[text] || text;
        }

        async function fetchCar(carId) {
            try {
                const response = await fetch(`/api/car/${carId}`);
                if (!response.ok) return null;
                return await response.json();
            } catch (error) {
                console.error(`Failed to fetch car ${carId}:`, error);
                return null;
            }
        }

        function formatPrice(price) {
            return `₩ ${(price * 10000).toLocaleString('en-US')}`;
        }

        function createCarCard(data) {
            const cat = data.category || {};
            const spec = data.spec || {};
            const ad = data.advertisement || {};
            const photos = data.photos || [];

            const carName = `${cat.manufacturerEnglishName || cat.manufacturerName || ''} ${cat.modelGroupEnglishName || cat.modelGroupName || ''}`.trim();
            const photoUrl = photos[0]?.location ? `http://ci.encar.com${photos[0].location}` : '';

            return `
                <div class="card">
                    ${photoUrl
                    ? `<img src="${photoUrl}" alt="${carName}" class="card-image">`
                    : '<div class="card-image loading"><div class="spinner"></div></div>'
                }
                    <div class="card-body">
                        <div class="car-title">${carName || 'Unknown Model'}</div>
                        <div class="specs-grid">
                            <div class="spec-item">
                                <div class="spec-label">Year</div>
                                <div class="spec-value">${spec.yearName || '-'}</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-label">Fuel</div>
                                <div class="spec-value">${translate(spec.fuelName) || '-'}</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-label">Color</div>
                                <div class="spec-value">${translate(spec.colorName) || '-'}</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-label">Mileage</div>
                                <div class="spec-value">${(spec.mileage || 0).toLocaleString()} km</div>
                            </div>
                        </div>
                        <div class="price-tag">${formatPrice(ad.price || 0)}</div>
                    </div>
                </div>
            `;
        }

        function createPlaceholderCard() {
            return `
                <div class="card placeholder">
                    <div class="placeholder-overlay">
                        <h3>⏳ Coming Soon</h3>
                        <p>New vehicle arriving...</p>
                    </div>
                    <div class="card-image" style="background: #cbd5e0;"></div>
                    <div class="card-body">
                        <div class="car-title" style="color: #a0aec0;">TBA Model</div>
                        <div class="specs-grid">
                            <div class="spec-item">
                                <div class="spec-label">Year</div>
                                <div class="spec-value" style="color: #cbd5e0;">-</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-label">Fuel</div>
                                <div class="spec-value" style="color: #cbd5e0;">-</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-label">Color</div>
                                <div class="spec-value" style="color: #cbd5e0;">-</div>
                            </div>
                            <div class="spec-item">
                                <div class="spec-label">Mileage</div>
                                <div class="spec-value" style="color: #cbd5e0;">-</div>
                            </div>
                        </div>
                        <div class="price-tag" style="background: #cbd5e0;">₩ 0</div>
                    </div>
                </div>
            `;
        }

        async function loadCatalog() {
            const catalog = document.getElementById('catalog');
            catalog.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            // Fetch all active cars
            const activePromises = ACTIVE_CAR_IDS.map(id => fetchCar(id));
            const activeCars = await Promise.all(activePromises);

            // Fetch upcoming car slot
            const upcomingCar = await fetchCar(UPCOMING_CAR_SLOT_ID);

            let html = '';

            // Render active cars
            activeCars.forEach(car => {
                if (car) {
                    html += createCarCard(car);
                } else {
                    html += '<div class="error-card">⚠️ Failed to load vehicle</div>';
                }
            });

            // Render upcoming car or placeholder
            if (upcomingCar) {
                html += createCarCard(upcomingCar);
            } else {
                html += createPlaceholderCard();
            }

            catalog.innerHTML = html;
        }

        // Initial load
        loadCatalog();

        // Auto-refresh
        setInterval(loadCatalog, REFRESH_INTERVAL);

        console.log(`🔄 Auto-refresh enabled: ${REFRESH_INTERVAL / 1000}s interval`);
    </script>
</body>

</html>
