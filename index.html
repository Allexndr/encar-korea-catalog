<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encar Cars Demo</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            color: white;
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .subtitle {
            text-align: center;
            color: rgba(255,255,255,0.9);
            font-size: 1.2rem;
            margin-bottom: 50px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.4);
        }

        .card-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 15px 20px;
            color: white;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-header.korean {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .image-placeholder {
            width: 100%;
            height: 240px;
            background: linear-gradient(135deg, #e0e0e0 0%, #f5f5f5 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        .image-placeholder img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            color: #999;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .card-body {
            padding: 25px;
        }

        .car-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #2d3748;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .specs {
            display: grid;
            gap: 12px;
            margin-bottom: 20px;
        }

        .spec-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .spec-label {
            color: #718096;
            font-weight: 500;
        }

        .spec-value {
            color: #2d3748;
            font-weight: 600;
        }

        .price {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 20px;
        }

        .price.korean {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .error {
            background: #fee;
            color: #c33;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚗 Encar Live Demo</h1>
        <p class="subtitle">2 cards with English translation + 2 cards in Korean</p>
        
        <div class="grid" id="cars-container">
            <!-- Cards will be inserted here -->
        </div>
    </div>

    <script>
        // Translation dictionary
        const translations = {
            '디젤': 'Diesel',
            '가솔린': 'Gasoline',
            '휘발유': 'Gasoline',
            'LPG': 'LPG',
            '하이브리드': 'Hybrid',
            '전기': 'Electric',
            '검정색': 'Black',
            '흰색': 'White',
            '은색': 'Silver',
            '회색': 'Gray',
            '파란색': 'Blue',
            '빨간색': 'Red',
            '녹색': 'Green',
            '노란색': 'Yellow'
        };

        // Sample car IDs from Encar
        const carIds = [40570144, 40569845, 40569123, 40568901];

        async function fetchCarData(carId) {
            try {
                const response = await fetch(`/api/car/${carId}`);
                if (!response.ok) throw new Error('API failed');
                return await response.json();
            } catch (error) {
                console.error('Error fetching car:', error);
                return null;
            }
        }

        function translate(text) {
            return translations[text] || text;
        }

        function formatPrice(price) {
            return (price * 10000).toLocaleString('en-US');
        }

        function createCard(data, index) {
            const isTranslated = index < 2;
            const headerClass = isTranslated ? '' : 'korean';
            const priceClass = isTranslated ? '' : 'korean';

            const cat = data.category || {};
            const spec = data.spec || {};
            const ad = data.advertisement || {};
            const photos = data.photos || [];

            const carName = isTranslated 
                ? `${cat.manufacturerEnglishName || cat.manufacturerName} ${cat.modelGroupEnglishName || cat.modelGroupName}`
                : `${cat.manufacturerName} ${cat.modelGroupName}`;

            const fuel = isTranslated ? translate(spec.fuelName) : spec.fuelName;
            const color = isTranslated ? translate(spec.colorName) : spec.colorName;

            const photoUrl = photos[0]?.location 
                ? `http://ci.encar.com${photos[0].location}`
                : '';

            return `
                <div class="card">
                    <div class="card-header ${headerClass}">
                        ${isTranslated ? '🇬🇧 English Translation' : '🇰🇷 Korean Original'}
                    </div>
                    <div class="image-placeholder">
                        ${photoUrl ? `<img src="${photoUrl}" alt="Car">` : '<div class="loading">No Image</div>'}
                    </div>
                    <div class="card-body">
                        <div class="car-name">${carName}</div>
                        <div class="specs">
                            <div class="spec-row">
                                <span class="spec-label">${isTranslated ? 'Fuel' : '연료'}</span>
                                <span class="spec-value">${fuel || '-'}</span>
                            </div>
                            <div class="spec-row">
                                <span class="spec-label">${isTranslated ? 'Color' : '색상'}</span>
                                <span class="spec-value">${color || '-'}</span>
                            </div>
                            <div class="spec-row">
                                <span class="spec-label">${isTranslated ? 'Mileage' : '주행거리'}</span>
                                <span class="spec-value">${(spec.mileage || 0).toLocaleString()} km</span>
                            </div>
                        </div>
                        <div class="price ${priceClass}">
                            ₩ ${formatPrice(ad.price || 0)}
                        </div>
                    </div>
                </div>
            `;
        }

        async function loadCars() {
            const container = document.getElementById('cars-container');
            container.innerHTML = '<div class="loading"><div class="spinner"></div></div>';

            const cars = await Promise.all(carIds.map(id => fetchCarData(id)));
            
            container.innerHTML = cars
                .map((car, index) => car ? createCard(car, index) : `<div class="error">Failed to load car ${carIds[index]}</div>`)
                .join('');
        }

        loadCars();
    </script>
</body>
</html>
